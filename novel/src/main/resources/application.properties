# ============================================
# Spring Boot 主配置文件
# ============================================
# 说明：此文件定义了应用的环境配置文件激活策略
# 默认本地/IDEA 使用 dev；部署环境通过 SPRING_PROFILES_ACTIVE 覆盖为 prod
# ============================================
# 激活的Spring配置文件（开发环境或生产环境）
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}