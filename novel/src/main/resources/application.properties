# ============================================
# Spring Boot 主配置文件
# ============================================
# 说明：此文件定义了应用的环境配置文件激活策略
# @profileActive@ 会在 Maven 打包时被替换为实际的环境配置（dev/prod）
# ============================================
# 激活的Spring配置文件（开发环境或生产环境）
spring.profiles.active=@profileActive@