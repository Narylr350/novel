# ============================================
# Spring Boot 开发环境配置文件
# ============================================
# 环境：开发环境 (Development)
# 用途：本地开发和测试使用
# ============================================
# ============================================
# 基础配置
# ============================================
# 应用名称
spring.application.name=novel
# 服务器端口，默认 8081
server.port=${SERVER_PORT:8081}
# 服务器监听地址，0.0.0.0 表示接受所有网络接口的请求
server.address=0.0.0.0
# 应用默认时区设置为中国上海
spring.main.default-time-zone=Asia/Shanghai
# 允许 Spring Bean 循环依赖（谨慎使用）
spring.main.allow-circular-references=true
# 启用虚拟线程（Java 21+ 特性，提高并发性能）
spring.threads.virtual.enabled=true
# 保持应用活跃状态
spring.main.keep-alive=true
# ============================================
# 监控端点配置 (Actuator)
# ============================================
# 暴露的端点：健康检查和应用信息
management.endpoints.web.exposure.include=health,info
# 健康检查详情展示策略：仅在授权后显示
management.endpoint.health.show-details=when-authorized
# 启用默认健康检查指标
management.health.defaults.enabled=true
# 监控端点基础路径
management.endpoints.web.base-path=/actuator
# 监控服务端口，与主服务端口相同
management.server.port=${SERVER_PORT:8081}
# ============================================
# API 签名配置
# ============================================
# API 签名密钥（保留环境变量入口，默认不写死到仓库）
api.signature.secret=${API_SIGNATURE_SECRET:}
# 开发环境允许本地前端跨域访问后端
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:8080}
# ============================================
# 站点地图配置
# ============================================
# 是否运行站点地图生成，开发环境默认启用
siteMap.run=${SITEMAP_RUN:true}
# ============================================
# 任务调度配置
# ============================================
# 任务调度器总开关，开发环境默认关闭
task.scheduler.enabled=${TASK_SCHEDULER_ENABLED:false}
# ============================================
# 任务失败处理配置
# ============================================
# 任务失败阈值：连续失败次数超过此值将禁用任务
task.failure.threshold=${TASK_FAILURE_THRESHOLD:3}
# 任务失败计数重置时间（分钟）
task.failure.reset.minutes=${TASK_FAILURE_RESET_MINUTES:60}
# ============================================
# Novelpia 相关任务开关
# ============================================
# Novelpia 任务2：开发环境默认关闭
task.novelpia.task2.enabled=${TASK_NOVELPIA_TASK2_ENABLED:false}
# Novelpia 图片处理任务：开发环境默认关闭
task.novelpia.photo.enabled=${TASK_NOVELPIA_PHOTO_ENABLED:false}
# Novelpia 翻译上传任务：开发环境默认关闭
task.novelpia.upload.translation.enabled=${TASK_NOVELPIA_UPLOAD_TRANSLATION_ENABLED:false}
# Novelpia 翻译异常处理任务：开发环境默认关闭
task.novelpia.upload.translation.exception.enabled=${TASK_NOVELPIA_UPLOAD_TRANSLATION_EXCEPTION_ENABLED:false}
# Novelpia 任务3：开发环境默认关闭
task.novelpia.task3.enabled=${TASK_NOVELPIA_TASK3_ENABLED:false}
# Novelpia 错误章节修复任务：开发环境默认关闭
task.novelpia.fix.error.chapter.enabled=${TASK_NOVELPIA_FIX_ERROR_CHAPTER_ENABLED:false}
# ============================================
# 站点地图生成任务开关
# ============================================
# HTML 站点地图生成器：开发环境默认关闭
task.sitemap.html.generator.enabled=${TASK_SITEMAP_HTML_GENERATOR_ENABLED:false}
# 站点地图索引生成器：开发环境默认关闭
task.sitemap.index.generator.enabled=${TASK_SITEMAP_INDEX_GENERATOR_ENABLED:false}
# ============================================
# 其他任务开关
# ============================================
# Novelpia 爬虫任务：开发环境默认关闭
task.novelpia.crawler.enabled=${TASK_NOVELPIA_CRAWLER_ENABLED:false}
# 从文件更新小说任务：开发环境默认关闭
task.update.novel.from.file.enabled=${TASK_UPDATE_NOVEL_FROM_FILE_ENABLED:false}
# 章节同步任务：开发环境默认关闭
task.chapter.sync.enabled=${TASK_CHAPTER_SYNC_ENABLED:false}
# ============================================
# 文件上传配置
# ============================================
# 单个文件最大上传大小
spring.servlet.multipart.max-file-size=40MB
# 单次请求最大上传大小
spring.servlet.multipart.max-request-size=40MB
# ============================================
# 任务调度线程池配置
# ============================================
# 定时任务线程池大小
spring.task.scheduling.pool.size=20
# ============================================
# 代理配置
# ============================================
# 代理服务器地址
proxy.host=${PROXY_HOST:127.0.0.1}
# 代理服务器端口
proxy.port=${PROXY_PORT:7890}
# 是否启用代理客户端
proxy.client=${PROXY_CLIENT:false}
# ============================================
# Cloudflare R2 对象存储配置
# ============================================
# Cloudflare 账户 ID
cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID:}
# Cloudflare R2 访问密钥
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
# Cloudflare R2 密钥
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
# R2 存储桶名称
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:photo}
# R2 区域设置
cloudflare.r2.region=${CLOUDFLARE_R2_REGION:auto}
# 是否启用 Cloudflare R2，开发环境默认关闭
cloudflare.r2.enabled=${CLOUDFLARE_R2_ENABLED:false}
# ============================================
# 文件存储路径配置
# ============================================
# 运行时根目录（日志、临时文件、文件存储统一落到这里）
app.runtime.base-dir=${APP_RUNTIME_BASE_DIR:./app}
# 临时文件上传目录
file.upload.temp-dir=${FILE_UPLOAD_TEMP_DIR:${app.runtime.base-dir}/tmp/}
# 文件存储目录
file.upload.storage-dir=${FILE_UPLOAD_STORAGE_DIR:${app.runtime.base-dir}/file/}
# ============================================
# 数据库配置
# ============================================
# 数据库模式：single(单数据库) / dual(主从数据库)
database.mode=${DATABASE_MODE:single}
# 前端运行模式：开发环境默认开放维护者界面
app.ui.mode=${APP_UI_MODE:maintainer}
# ============================================
# 主数据源配置 (Primary DataSource)
# ============================================
# 主数据库 JDBC 连接地址
spring.datasource.primary.jdbc-url=${PRIMARY_DB_URL:jdbc:mariadb://localhost:3306/novel?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&connectTimeout=30000&socketTimeout=60000}
# 主数据库用户名
spring.datasource.primary.username=${PRIMARY_DB_USERNAME:root}
# 主数据库密码
spring.datasource.primary.password=${PRIMARY_DB_PASSWORD:novel_root_password}
# 数据库驱动类
spring.datasource.primary.driver-class-name=org.mariadb.jdbc.Driver
# ----------------------------------------
# 主数据源 HikariCP 连接池配置
# ----------------------------------------
# 最大连接池大小
spring.datasource.primary.hikari.maximum-pool-size=${PRIMARY_DB_POOL_SIZE:15}
# 最小空闲连接数
spring.datasource.primary.hikari.minimum-idle=${PRIMARY_DB_MIN_IDLE:5}
# 连接超时时间（30秒）
spring.datasource.primary.hikari.connection-timeout=30000
# 空闲连接超时时间（10分钟）
spring.datasource.primary.hikari.idle-timeout=600000
# 连接最大生命周期（30分钟）
spring.datasource.primary.hikari.max-lifetime=1800000
# 连接测试查询语句
spring.datasource.primary.hikari.connection-test-query=SELECT 1
# 连接池名称
spring.datasource.primary.hikari.pool-name=PrimaryHikariPool
# 连接泄漏检测阈值（60秒）
spring.datasource.primary.hikari.leak-detection-threshold=60000
# JPA Hibernate DDL 自动创建策略（none 表示不自动生成表结构）
spring.jpa.hibernate.ddl-auto=none
# ============================================
# 从数据源配置 (Secondary DataSource)
# ============================================
# 说明：仅在 database.mode=dual 时启用
# 从数据库 JDBC 连接地址
spring.datasource.secondary.jdbc-url=${SECONDARY_DB_URL:jdbc:mariadb://localhost:3306/novel?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&connectTimeout=30000&socketTimeout=60000}
# 从数据库用户名
spring.datasource.secondary.username=${SECONDARY_DB_USERNAME:root}
# 从数据库密码
spring.datasource.secondary.password=${SECONDARY_DB_PASSWORD:}
# 数据库驱动类
spring.datasource.secondary.driver-class-name=org.mariadb.jdbc.Driver
# ----------------------------------------
# 从数据源 HikariCP 连接池配置
# ----------------------------------------
# 最大连接池大小
spring.datasource.secondary.hikari.maximum-pool-size=${SECONDARY_DB_POOL_SIZE:8}
# 最小空闲连接数
spring.datasource.secondary.hikari.minimum-idle=${SECONDARY_DB_MIN_IDLE:3}
# 连接超时时间（30秒）
spring.datasource.secondary.hikari.connection-timeout=30000
# 空闲连接超时时间（10分钟）
spring.datasource.secondary.hikari.idle-timeout=600000
# 连接最大生命周期（30分钟）
spring.datasource.secondary.hikari.max-lifetime=1800000
# 连接测试查询语句
spring.datasource.secondary.hikari.connection-test-query=SELECT 1
# 连接池名称
spring.datasource.secondary.hikari.pool-name=SecondaryHikariPool
# 连接泄漏检测阈值（60秒）
spring.datasource.secondary.hikari.leak-detection-threshold=60000
# 从数据源 JPA Hibernate DDL 自动创建策略
spring.secondary.jpa.hibernate.ddl-auto=none
# ============================================
# 日志配置
# ============================================
# 根日志级别
logging.level.root=INFO
# 应用包日志级别
logging.level.com.wtl.novel=INFO
# 控制台日志输出格式（带颜色高亮）
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n
# 文件日志输出格式
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# 日志文件存储路径
logging.file.path=${LOG_FILE_PATH:${app.runtime.base-dir}/logs}
# 单个日志文件最大大小
logging.file.max-size=10MB
# 日志文件保留天数
logging.file.max-history=30
