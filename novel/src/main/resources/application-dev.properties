# HikariCP Ã¨Â¿ÂÃ¦ÂÂ¥Ã¦Â±Â Ã©ÂÂÃ§Â½Â®
spring.datasource.primary.hikari.maximum-pool-size=${PRIMARY_DB_POOL_SIZE:15}
